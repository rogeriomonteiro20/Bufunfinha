<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Transação</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<header class="w-full bg-white border-b border-gray-200">
    <div class="px-6 py-4">
        <a class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition">
            Bufunfinha
        </a>
    </div>
</header>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto px-6 py-12">

        <div class="mb-8">

            <h1 class="text-2xl font-bold text-gray-800">
                Editar transação
            </h1>

            <p class="text-gray-500 mt-1">
                Conta:
                <span class="font-medium text-gray-700" th:text="${conta.descricao}">
                    Minha conta
                </span>
            </p>

        </div>


        <div class="bg-white rounded-xl shadow-sm p-8">

            <form th:action="@{/correntista/{correntistaId}/conta/{contaId}/transacao/{transacaoId}/editar(
                    correntistaId=${correntistaId},
                    contaId=${conta.id},
                    transacaoId=${transacaoForm.id})}" th:object="${transacaoForm}" method="post">


                <!-- Descrição -->

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Descrição
                    </label>

                    <input type="text" th:field="*{descricao}" class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Ex: Compra no supermercado" required>

                </div>


                <!-- Valor -->

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Valor
                    </label>

                    <input type="number" step="0.01" th:field="*{valor}" class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0,00" required>

                </div>


                <!-- Data -->

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Data
                    </label>

                    <input type="date" th:field="*{data}" class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500" required>

                </div>


                <!-- Movimento -->

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Movimento
                    </label>

                    <select th:field="*{movimento}" class="w-full border border-gray-300 rounded-lg px-4 py-3
                               focus:outline-none focus:ring-2 focus:ring-blue-500" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="ENTRADA">
                            Entrada
                        </option>

                        <option value="SAIDA">
                            Saída
                        </option>

                    </select>

                </div>


                <!-- Categoria -->

                <div class="mb-8">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Categoria
                    </label>

                    <select name="categoriaId" class="w-full border border-gray-300 rounded-lg px-4 py-3
                               focus:outline-none focus:ring-2 focus:ring-blue-500" required>

                        <option th:each="categoria : ${categorias}" th:value="${categoria.id}"
                            th:text="${categoria.nome}" th:selected="${transacaoForm.categoria != null
                                          and categoria.id == transacaoForm.categoria.id}">
                        </option>

                    </select>

                </div>


                <!-- Erro -->

                <div th:if="${erro}" class="mb-5 bg-red-100 text-red-700 px-4 py-3 rounded-lg" th:text="${erro}">
                    Erro
                </div>


                <!-- Botões -->

                <div class="flex justify-end gap-3">

                    <a th:href="@{/correntista/{correntistaId}/conta/{contaId}(
                            correntistaId=${correntistaId},
                            contaId=${conta.id})}" class="px-5 py-3 rounded-lg border border-gray-300
                          text-gray-700 hover:bg-gray-50 transition">

                        Cancelar

                    </a>

                    <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-lg
                               hover:bg-blue-700 transition">

                        Salvar alterações

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
