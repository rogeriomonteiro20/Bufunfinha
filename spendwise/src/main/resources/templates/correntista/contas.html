<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Contas</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-5xl mx-auto px-6 py-12">

    <div class="flex items-center justify-between mb-8">

        <div>
            <h1 class="text-2xl font-bold text-gray-800">
                Minhas Contas
            </h1>

            <p class="text-gray-500 mt-1">
                Consulte suas contas e cartões cadastrados.
            </p>
        </div>

        <a th:href="@{/correntista/{id}/cadastrar(id=${id})}"
           class="bg-blue-600 text-white px-5 py-3 rounded-lg
                  hover:bg-blue-700 transition">

            Nova conta

        </a>

    </div>


    <!-- Caso não existam contas -->

    <div th:if="${#lists.isEmpty(contas)}"
         class="bg-white rounded-xl shadow-sm p-10 text-center">

        <h2 class="text-lg font-semibold text-gray-700">
            Você ainda não possui contas cadastradas.
        </h2>

        <p class="text-gray-500 mt-2">
            Cadastre sua primeira conta para começar.
        </p>

        <a th:href="@{/correntista/{id}/cadastrar(id=${id})}"
           class="inline-block mt-6 bg-blue-600 text-white
                  px-5 py-3 rounded-lg hover:bg-blue-700 transition">

            Cadastrar conta

        </a>

    </div>


    <!-- Lista de contas -->

    <div th:unless="${#lists.isEmpty(contas)}"
         class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Card da conta -->

        <a th:each="conta : ${contas}"
           th:href="@{/correntista/{correntistaId}/conta/{contaId}(
                        correntistaId=${id},
                        contaId=${conta.id})}"
           class="bg-white rounded-xl shadow-sm p-6 block
                  hover:shadow-md hover:bg-gray-50 transition cursor-pointer">

            <div class="flex items-start justify-between">

                <div>

                    <p class="text-sm text-gray-500">
                        Descrição
                    </p>

                    <h2 class="text-xl font-semibold text-gray-800"
                        th:text="${conta.descricao}">
                        Minha conta
                    </h2>

                </div>


                <!-- Tipo -->

                <span th:if="${conta.tipo.name() == 'CORRENTE'}"
                      class="px-3 py-1 text-sm font-medium
                             bg-blue-100 text-blue-700 rounded-full">

                    Conta Corrente

                </span>

                <span th:if="${conta.tipo.name() == 'CARTAO'}"
                      class="px-3 py-1 text-sm font-medium
                             bg-purple-100 text-purple-700 rounded-full">

                    Cartão de Crédito

                </span>

            </div>


            <div class="mt-6 space-y-3">

                <div>

                    <p class="text-sm text-gray-500">
                        Número
                    </p>

                    <p class="text-gray-800"
                       th:text="${conta.numero}">
                        3212-1
                    </p>

                </div>


                <div th:if="${conta.tipo.name() == 'CARTAO'}">

                    <p class="text-sm text-gray-500">
                        Dia de fechamento
                    </p>

                    <p class="text-gray-800"
                       th:text="${conta.diaFechamento}">
                        10
                    </p>

                </div>

            </div>

        </a>

    </div>

</div>

</body>

</html>
