<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Conta</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<header class="w-full bg-white border-b border-gray-200">
    <div class="px-6 py-4">
        <a class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition">
            Bufunfinha
        </a>
    </div>
</header>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto px-6 py-12">

        <div class="bg-white rounded-xl shadow-sm p-8">

            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-800">
                    Cadastrar Conta
                </h1>

                <p class="text-gray-500 mt-1">
                    Cadastre uma nova conta ou cartão de crédito.
                </p>
            </div>

            <form th:action="@{/correntista/{id}/cadastrar(id=${id})}" th:object="${contaForm}" method="post"
                class="space-y-6">

                <div>
                    <label for="numero" class="block text-sm font-medium text-gray-700 mb-2">
                        Número
                    </label>

                    <input type="text" id="numero" th:field="*{numero}" placeholder="Ex: 3212-1" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                              focus:outline-none focus:ring-2 focus:ring-blue-500
                              focus:border-blue-500">
                    <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}">
                    </p>
                </div>

                <div>
                    <label for="descricao" class="block text-sm font-medium text-gray-700 mb-2">
                        Descrição
                    </label>

                    <input type="text" id="descricao" th:field="*{descricao}" placeholder="Ex: Minha conta no BB" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                              focus:outline-none focus:ring-2 focus:ring-blue-500
                              focus:border-blue-500">
                    <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('descricao')}"
                        th:errors="*{descricao}"></p>
                </div>

                <div>
                    <label for="tipo" class="block text-sm font-medium text-gray-700 mb-2">
                        Tipo
                    </label>

                    <select id="tipo" th:field="*{tipo}" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               bg-white focus:outline-none focus:ring-2
                               focus:ring-blue-500 focus:border-blue-500">

                        <option value="">Selecione o tipo</option>
                        <option value="CORRENTE">Conta Corrente</option>
                        <option value="CARTAO">Cartão de Crédito</option>

                    </select>
                    <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></p>
                </div>

                <div>
                    <label for="diaFechamento" class="block text-sm font-medium text-gray-700 mb-2">
                        Dia de fechamento
                    </label>

                    <input type="number" id="diaFechamento" th:field="*{diaFechamento}" min="1" max="31"
                        placeholder="Ex: 10" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                              focus:outline-none focus:ring-2 focus:ring-blue-500
                              focus:border-blue-500">


                    <p class="text-sm text-gray-500 mt-1">
                        Informe apenas para cartões de crédito.
                    </p>
                    <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('diaFechamento')}"
                        th:errors="*{diaFechamento}"></p>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-medium py-3
                           rounded-lg hover:bg-blue-700 transition">
                    Cadastrar
                </button>

            </form>

            <div class="mt-6 text-center">
                <a th:href="@{/correntista/{id}/contas(id=${id})}" class="text-blue-600 hover:text-blue-800 text-sm">
                    Ver minhas contas
                </a>
            </div>

        </div>

    </div>

</body>

</html>
